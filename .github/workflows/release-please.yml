name: Release

# Merges to main accumulate changes in a Release Please PR. Merging that PR is
# the deliberate, human-reviewed act that cuts a version tag and updates
# CHANGELOG.md. It applies nothing: the workspace is applied from
# jwall-engineering-infra (the Databricks apply workflow).

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      # A GitHub App token (not GITHUB_TOKEN) so that release PRs are authored
      # by jwallace145-release-bot[bot] and CI runs on them.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
